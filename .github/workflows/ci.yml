name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  verify:
    name: Lint, types & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Biome / Ultracite (lint + format)
        run: pnpm check

      - name: Type-check and build (affected only on PRs)
        run: pnpm exec turbo run check-types build ${{ github.event_name == 'pull_request' && '--affected' || '' }}
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          RESEND_API_KEY: re_ci_placeholder
          WHATSAPP_BUSINESS_PHONE: "+351900000000"
          CONTACT_EMAIL_FROM: ci@example.com
          CONTACT_EMAIL_TO: ci@example.com
          BETTER_AUTH_SECRET: ci_placeholder
          CODIGO_ACESSO_INTERNO: ci_placeholder
          TREINOS_CRON_SECRET: ci_placeholder

  database:
    name: Database schema check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Drizzle snapshot consistency
        run: pnpm db:check
      - name: Schema is in sync with migrations (no pending diff)
        run: |
          pnpm db:generate
          test -z "$(git status --porcelain packages/database/src/drizzle)" || { git status --porcelain packages/database/src/drizzle; exit 1; }
